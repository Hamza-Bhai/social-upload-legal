<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Code | Social Upload Automation</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0 auto; padding: 48px 20px; max-width: 42rem;
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.4rem; }
  code, #code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: .95rem;
  }
  #code {
    display: block; width: 100%; box-sizing: border-box;
    padding: 12px; margin: 12px 0;
    border: 1px solid rgba(128,128,128,.45); border-radius: 6px;
    background: rgba(128,128,128,.08); word-break: break-all;
    min-height: 3rem;
  }
  button {
    padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(128,128,128,.45); background: rgba(128,128,128,.12);
    font: inherit; color: inherit;
  }
  .err { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .err { color: #ff8a80; } }
  .hint { opacity: .75; font-size: .9rem; }
</style>
</head>
<body>
  <h1>Authorization code</h1>
  <p class="hint">Copy this value and paste it into the setup script running in your
    terminal. It is single-use and expires quickly.</p>

  <div id="code">Reading…</div>
  <button id="copy" hidden>Copy</button>

  <p class="hint" id="state"></p>

  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var box = document.getElementById('code');
      var btn = document.getElementById('copy');
      var code = p.get('code');
      var err = p.get('error');

      if (err) {
        box.textContent = 'Authorization failed: ' + err +
          (p.get('error_description') ? ' — ' + p.get('error_description') : '');
        box.className = 'err';
        return;
      }
      if (!code) {
        box.textContent = 'No authorization code in the URL. Start the sign-in again.';
        box.className = 'err';
        return;
      }

      box.textContent = code;
      btn.hidden = false;
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
        }, function () {
          btn.textContent = 'Copy failed — select the text manually';
        });
      });

      var st = p.get('state');
      if (st) {
        document.getElementById('state').textContent = 'state: ' + st;
      }
    })();
  </script>
</body>
</html>
